name: render

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      thm:
        description: "TryHackMe numbers as JSON (level, title, rank, top_percent, badges, streak, rooms, as_of)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: TryHackMe numbers (manual)
        if: ${{ inputs.thm != '' }}
        env:
          THM_IN: ${{ inputs.thm }}
        run: |
          echo "$THM_IN" | jq -e '(.rank|type=="number") and (.rooms|type=="number") and (.badges|type=="number") and (.streak|type=="number") and (.level|type=="string") and (.as_of|test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' > /dev/null
          echo "$THM_IN" | jq '{username:"Sepd", level, title, rank, top_percent, badges, streak, rooms, source:"manual", as_of}' > data/thm.json
          cat data/thm.json

      - name: Render
        working-directory: tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THM_LIVE: '0'
        run: node render.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/thm.json
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -m "render $(date -u +%Y-%m-%d)"
          git push

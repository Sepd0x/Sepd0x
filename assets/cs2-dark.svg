}97.86%,100%{opacity:0;transform:translateY(0)}}@keyframes hn{0%,50%{opacity:0;transform:translateY(-10px)}53.57%,95.71%{opacity:1;transform:translateY(0)}97.86%,100%{opacity:0}}@keyframes hd{0%,50%{transform:translateY(0)}53.57%,95.71%{transform:translateY(22px)}98.57%,100%{transform:translateY(0)}}@keyframes to{0%,50.71%{opacity:0;transform:translateY(8px)}53.57%,82.86%{opacity:1;transform:translateY(0)}85.71%,100%{opacity:0}}@keyframes bar{from{transform:translateX(-126px)}to{transform:translateX(420px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="999" height="929" rx="16" fill="rgba(240,246,252,.035)" stroke="rgba(240,246,252,.13)"/><text class="s ink" x="38" y="92" font-size="44" font-weight="600" letter-spacing="-1">CS2 IP Changer</text><text class="s mu" x="40" y="136" font-size="19">Sends CS2 and Steam through your Android phone’s mobile data,</text><text class="s mu" x="40" y="163" font-size="19">so community servers see your carrier’s IP and not your home IP.</text><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".4"/></filter><rect x="40" y="199" width="920" height="549.2" rx="11.2" fill="#121212" filter="url(#sh)"/><g transform="translate(40 199) scale(1.3939)"><rect x=".5" y=".5" width="659" height="393" rx="8" fill="#121212" stroke="#2a2a2a"/><linearGradient id="tb" x1="0" x2="1"><stop offset="0" stop-color="#3bb4e5"/><stop offset=".5" stop-color="#c64fc6"/><stop offset="1" stop-color="#d8e03a"/></linearGradient><clipPath id="wc"><rect x="1" y="1" width="658" height="392" rx="7.5"/></clipPath><g clip-path="url(#wc)"><rect x="0" y="0" width="660" height="2" fill="url(#tb)"/></g><text x="16" y="25" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#9b9b9b">CS2 IP Changer</text><text x="110" y="25" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#383838">/</text><text x="122" y="25" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#dddddd">Connection</text><path d="M0 39.5H660" stroke="#2a2a2a"/><rect x="14.5" y="56.5" width="631" height="195" fill="#171717" stroke="#2a2a2a"/><rect x="22" y="50" width="49.599999999999994" height="12" fill="#121212"/><text x="27" y="60" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#dddddd">Status</text><g class="hg"><rect x="30" y="74" width="30" height="30" fill="#7cc95a" fill-opacity=".12"/><path d="M45 81l6.375 2.4v4.65c0 4.65-2.85 7.35-6.375 8.85c-3.525-1.5-6.375-4.2-6.375-8.85v-4.65z" fill="none" stroke="#7cc95a" stroke-width="1.4" stroke-linejoin="round"/><text x="72" y="87" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#7cc95a">Protected</text><text x="72" y="104" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9b9b9b">Servers on your list only see the phone’s IP. If the phone drops, they are blocked.</text></g><g class="hw"><rect x="30" y="74" width="30" height="30" fill="#e3bf4b" fill-opacity=".12"/><path d="M45 81l6.375 2.4v4.65c0 4.65-2.85 7.35-6.375 8.85c-3.525-1.5-6.375-4.2-6.375-8.85v-4.65z" fill="none" stroke="#e3bf4b" stroke-width="1.4" stroke-linejoin="round"/><text x="72" y="87" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="16" font-weight="600" fill="#e3bf4b">Checking the phone’s IP…</text><text x="72" y="104" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9b9b9b">Servers on your list stay blocked until the app confirms the new IP.</text></g><text x="30" y="130" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#888888">IP servers see</text><clipPath id="ipc"><rect x="30" y="134" width="290" height="44"/></clipPath><g clip-path="url(#ipc)"><g class="io"><text x="30" y="156" font-family="'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Roboto Mono',monospace" font-size="19" font-weight="400" fill="#dddddd">198.51.100.188</text><text x="30" y="173" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9b9b9b">Telefonica Germany · Berlin · Germany</text></g><g class="in"><text x="30" y="156" font-family="'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Roboto Mono',monospace" font-size="19" font-weight="400" fill="#dddddd">192.0.2.23</text><text x="30" y="173" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#9b9b9b">Telefonica Germany · Munich · Germany</text></g></g><text x="338" y="130" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#888888">Your home IP</text><text x="338" y="156" font-family="'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Roboto Mono',monospace" font-size="19" font-weight="400" fill="#888888">203.0.•••.•••</text><text x="338" y="173" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#888888">Deutsche Telekom AG · Hamburg · Germany</text><g class="ar"><g class="cb"><rect x="30.5" y="198.5" width="95" height="27" rx="2" fill="#5ba8f0" stroke="#5ba8f0"/><text x="78" y="216" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="600" fill="#0b0b0b" text-anchor="middle">Change IP</text></g><g><rect x="132.5" y="198.5" width="147" height="27" rx="2" fill="#1d1d1d" stroke="#383838"/><text x="206" y="216" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#dddddd" text-anchor="middle">Change IP and rejoin</text></g><g><rect x="286.5" y="198.5" width="103" height="27" rx="2" fill="#1d1d1d" stroke="#383838"/><text x="338" y="216" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#dddddd" text-anchor="middle">Run leak test</text></g></g><g class="pr"><g class="m1"><text x="30" y="208" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#dddddd">Attempt 1/3: turning off the phone’s data for 4 s…</text></g><g class="m2"><text x="30" y="208" font-family="'Segoe UI Variable Text','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif" font-size="12" font-weight="400" fill="#dddddd">Attempt 1/3: waiting for the mobile network to come back…</text></g><rect x="30" y="216" width="420" height="4" fill="#262626"/><clipPath id="pb"><rect x="30" y="216" width="420" height="4"/></clipPath><g clip-path="url(#pb)"><rect class="bar" x="30" y="216" width="126" height="4" fill="#5ba8f0"/></g></g><rect x="14.5" y="272.5" width="631" height="
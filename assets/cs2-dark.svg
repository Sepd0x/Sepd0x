 accounts without passwords</text><text x="40" y="890.2121212121212" font-size="15.5"><tspan class="s fa">Never touches the game process or its files · no telemetry&#160;·</tspan><tspan dx="0.3em" class="m fa">v0.1.0-beta.1</tspan><tspan class="s fa" dx="0.3em">·&#160;Windows 10/11</tspan></text></svg>

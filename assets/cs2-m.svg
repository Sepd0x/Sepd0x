<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1170" width="600" height="1170" role="img" aria-label="Pickroute (formerly CS2 IP Changer): a CS2 server picker for the 30 matchmaking regions, and CS2 over your phone’s mobile data so community servers only see your carrier’s IP. Never touches the game."><style>.s{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Roboto,Arial,sans-serif}.m{font-family:'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,'Roboto Mono',monospace}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="600" height="1170" rx="28" fill="#0b0b0c"/><image href="data:image/svg+xml;base64," x="40" y="44" width="72" height="72"/><text class="s" x="38" y="176" font-size="50" font-weight="650" fill="#f4f4f2" letter-spacing="-1.4">Pickroute</text><text x="40" y="220" font-size="20"><tspan class="m" fill="#f4f4f2" font-weight="600">182</tspan><tspan class="s" fill="#a3a39f" dx="0.3em">downloads</tspan><tspan class="s" fill="#8a8a86" dx="0.45em">·</tspan><tspan class="m" fill="#f4f4f2" font-weight="600" dx="0.45em">20</tspan><tspan class="s" fill="#a3a39f" dx="0.3em">releases</tspan><tspan class="s" fill="#8a8a86" dx="0.45em">·</tspan><tspan class="m" fill="#f4f4f2" font-weight="600" dx="0.45em">17</tspan><tspan class="s" fill="#a3a39f" dx="0.3em">stars</tspan></text><text x="40" y="250" font-size="20"><tspan class="m" fill="#f4f4f2" font-weight="600">0/67</tspan><tspan class="s" fill="#a3a39f" dx="0.3em">on VirusTotal</tspan><tspan class="s" fill="#8a8a86" dx="0.45em">·</tspan><tspan class="s" fill="#a3a39f" dx="0.45em">Windows 10/11</tspan></text><text class="s" x="40" y="312" font-size="21" font-weight="600" fill="#f4f4f2">Server picker.</text><text class="s" x="40" y="342" font-size="20" font-weight="400" fill="#a3a39f">Choose which of CS2’s 30 matchmaking</text><text class="s" x="40" y="372" font-size="20" font-weight="400" fill="#a3a39f">regions you queue in, with the ping of</text><text class="s" x="40" y="402" font-size="20" font-weight="400" fill="#a3a39f">each. No phone needed.</text><text class="s" x="40" y="468" font-size="21" font-weight="600" fill="#f4f4f2">Your phone’s IP.</text><text class="s" x="40" y="498" font-size="20" font-weight="400" fill="#a3a39f">CS2 plays over your phone’s mobile data,</text><text class="s" x="40" y="528" font-size="20" font-weight="400" fill="#a3a39f">so community servers only see your</text><text class="s" x="40" y="558" font-size="20" font-weight="400" fill="#a3a39f">carrier’s IP. Get a new one from the</text><text class="s" x="40" y="588" font-size="20" font-weight="400" fill="#a3a39f">app, or with Ctrl+Shift+F10 in game.</text><rect x="24" y="648" width="552" height="372" rx="22" fill="#18181b"/><text class="s" x="46" y="698" font-size="20" font-weight="600" fill="#f4f4f2">Regions</text><text class="s" x="554" y="698" font-size="17" font-weight="400" fill="#a3a39f" text-anchor="end">CS2 can play in 5 of 30</text><circle cx="54.7" cy="745.2" r="8.7" fill="#ffffff"/><text class="s" x="77.5" y="752" font-size="19" font-weight="600" fill="#f4f4f2">Frankfurt</text><text class="s" x="259.4" y="752" font-size="17.29" font-weight="400" fill="#a3a39f">Germany</text><rect x="474.2" y="727.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="750.1" font-size="16.72" font-weight="400" fill="#f4f4f2" text-anchor="middle">24 ms</text><circle cx="54.7" cy="783.2" r="8.7" fill="#ffffff"/><text class="s" x="77.5" y="790" font-size="19" font-weight="600" fill="#f4f4f2">Vienna</text><text class="s" x="259.4" y="790" font-size="17.29" font-weight="400" fill="#a3a39f">Austria</text><rect x="474.2" y="765.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="788.1" font-size="16.72" font-weight="400" fill="#f4f4f2" text-anchor="middle">30 ms</text><circle cx="54.7" cy="821.2" r="8.7" fill="#ffffff"/><text class="s" x="77.5" y="828" font-size="19" font-weight="600" fill="#f4f4f2">Amsterdam</text><text class="s" x="259.4" y="828" font-size="17.29" font-weight="400" fill="#a3a39f">Netherlands</text><rect x="474.2" y="803.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="826.1" font-size="16.72" font-weight="400" fill="#f4f4f2" text-anchor="middle">31 ms</text><circle cx="54.7" cy="859.2" r="8.7" fill="#ffffff"/><text class="s" x="77.5" y="866" font-size="19" font-weight="600" fill="#f4f4f2">Warsaw</text><text class="s" x="259.4" y="866" font-size="17.29" font-weight="400" fill="#a3a39f">Poland</text><rect x="474.2" y="841.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="864.1" font-size="16.72" font-weight="400" fill="#f4f4f2" text-anchor="middle">33 ms</text><circle cx="54.7" cy="897.2" r="8.7" fill="#ffffff"/><text class="s" x="77.5" y="904" font-size="19" font-weight="600" fill="#f4f4f2">London</text><text class="s" x="259.4" y="904" font-size="17.29" font-weight="400" fill="#a3a39f">United Kingdom</text><rect x="474.2" y="879.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="902.1" font-size="16.72" font-weight="400" fill="#f4f4f2" text-anchor="middle">39 ms</text><circle cx="54.7" cy="935.2" r="8.7" fill="rgba(255,255,255,.12)"/><text class="s" x="77.5" y="942" font-size="19" font-weight="600" fill="#8a8a86">Sterling</text><text class="s" x="259.4" y="942" font-size="17.29" font-weight="400" fill="#a3a39f">United States</text><rect x="474.2" y="917.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="940.1" font-size="16.72" font-weight="400" fill="#8a8a86" text-anchor="middle">112 ms</text><circle cx="54.7" cy="973.2" r="8.7" fill="rgba(255,255,255,.12)"/><text class="s" x="77.5" y="980" font-size="19" font-weight="600" fill="#8a8a86">Chicago</text><text class="s" x="259.4" y="980" font-size="17.29" font-weight="400" fill="#a3a39f">United States</text><rect x="474.2" y="955.3" width="79.8" height="32.3" rx="16.1" fill="rgba(255,255,255,.12)"/><text class="m" x="514.1" y="978.1" font-size="16.72" font-weight="400" fill="#8a8a86" text-anchor="middle">128 ms</text><text class="s" x="40" y="1086" font-size="18" font-weight="400" fill="#a3a39f">v1.0.1 · 27 Nov 2026</text><text class="s" x="40" y="1113" font-size="18" font-weight="400" fill="#a3a39f">Never touches the game process or its files.</text></svg>
